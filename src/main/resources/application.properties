spring.application.name=dsa-tracker

# Local PostgreSQL database (create it once with: createdb dsa_tracker).
# Override via DB_HOST/DB_PORT/DB_NAME/DATABASE_USER/DATABASE_PASSWORD env vars if ever
# needed -- defaults keep `./mvnw spring-boot:run` working unchanged with zero env vars
# set, same as before. In production (Render) these are wired to the managed Postgres
# instance via render.yaml's `fromDatabase` env vars.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dsa_tracker}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DATABASE_USER:steelbazaar}
spring.datasource.password=${DATABASE_PASSWORD:}
# Supabase's free tier caps total connections fairly low -- keep this small so one
# personal-project instance can't exhaust them on its own.
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Problem has 4 EAGER @ElementCollections and Topic/Problem each have a LAZY @OneToMany,
# none with @BatchSize -- without this, loading N problems fires ~5N separate queries
# (one per collection per entity). Invisible on localhost's near-zero latency, but over
# a real network (e.g. Render -> Supabase) DataSeeder's startup reconcile pass turned
# into thousands of round trips and got its socket killed mid-transaction. This batches
# those lazy/eager collection loads into chunked IN-clause queries instead.
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Flyway migrations were attempted but reverted: Spring Boot 4.1.1 does not yet ship
# FlywayAutoConfiguration (verified absent from spring-boot-autoconfigure-4.1.1.jar's
# AutoConfiguration.imports -- portfolio-be runs Spring Boot 3.5.7, where it exists).
# A baseline migration was generated and reviewed at
# src/main/resources/db/migration/V1__baseline.sql -- it's harmless sitting there unused,
# and ready to wire up (via spring.flyway.* properties here, once available) if this project
# ever moves to a Spring Boot version that supports it, or via a manually-ordered Flyway
# initializer bean if that's worth the added complexity later.

server.port=8081
server.error.include-message=always

# Local-only signing secret for personal-project auth. Rotate this (and everyone's tokens
# go stale) if it ever leaks. Override via JWT_SECRET env var if ever needed -- default
# matches the value this app has always used, so nothing changes with zero env vars set.
app.jwt.secret=${JWT_SECRET:a79c49a73459ad6cb26813216da575c7b17059e5527c8d711a54dfac4488a2be}
app.jwt.expiration-ms=2592000000

# ===============================
# CORS -- comma-separated list of allowed frontend origins. Override via
# CORS_ALLOWED_ORIGINS in production (e.g. your deployed Vercel/Netlify URL).
# ===============================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ===============================
# EMAIL (SMTP) -- config only, not wired to a feature yet. Empty defaults so the app boots
# cleanly with zero env vars set; set MAIL_USERNAME/MAIL_PASSWORD (a Gmail address + an App
# Password, https://myaccount.google.com/apppasswords) when a mail-sending feature needs it.
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Mail isn't wired to a feature yet, so its health check (which tries a real SMTP connection)
# would otherwise drag overall /actuator/health status to DOWN with no credentials set.
management.health.mail.enabled=false

# ===============================
# ACTUATOR
# ===============================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# ===============================
# SPRINGDOC / SWAGGER
# ===============================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ===============================
# AI (Gemini) -- free-tier key from https://aistudio.google.com. Every AI feature degrades
# gracefully (falls back to non-AI behavior) when this is unset, so the app boots and runs
# fine with zero env vars set, same as everything else here.
# ===============================
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-flash-lite-latest}

# ===============================
# RESPONSE COMPRESSION
# ===============================
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain,text/css,application/javascript
server.compression.min-response-size=1024
