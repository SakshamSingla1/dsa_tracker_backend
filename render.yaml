services:
  - type: web
    name: dsa-tracker-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      # Database is Supabase Postgres, not a Render-managed database -- these have no
      # default and must be set manually in the Render dashboard after creating the
      # Supabase project (Project Settings -> Database -> Connection pooling, Session
      # mode). sync: false keeps the actual values out of this committed file.
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DATABASE_USER
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Set this to your deployed frontend's URL once you have it
      # (e.g. https://dsa-tracker.vercel.app) -- update in the Render dashboard,
      # no redeploy of the Blueprint needed.
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:5173
