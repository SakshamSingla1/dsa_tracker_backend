services:
  - type: web
    name: dsa-tracker-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      # Database is Supabase Postgres, not a Render-managed database -- these have no
      # default and must be set manually in the Render dashboard after creating the
      # Supabase project (Project Settings -> Database -> Connection pooling, Session
      # mode). sync: false keeps the actual values out of this committed file.
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DATABASE_USER
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Your deployed frontend's origin (e.g. https://dsatracker.sakshamsingla.com).
      # sync: false so dashboard edits survive future git-triggered blueprint syncs.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Free-tier key from https://aistudio.google.com -- powers AI hints, AI code review,
      # and the AI-assisted parts of the recommendations feature. Optional: every AI feature
      # degrades gracefully (falls back to non-AI behavior) when this is unset, so the app
      # deploys and runs fine without it -- only set this once you actually want AI live.
      - key: GEMINI_API_KEY
        sync: false
      # This is a single-user personal tool with an unsandboxed code runner (see
      # CodeRunnerService) -- closing registration means only the one account already
      # created here can ever log in. Flip to "true" temporarily if you ever need to
      # create another account, then back to "false".
      - key: REGISTRATION_ENABLED
        value: "false"
